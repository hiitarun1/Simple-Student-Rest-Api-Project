<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="alerts">

    <div th:if="${flashMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${flashMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>

    </div>

</div>

</body>
</html>
