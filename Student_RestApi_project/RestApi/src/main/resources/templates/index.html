<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Student Dashboard</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.jpg}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1H9G1Q8K/6W2YdE2S8oFc5q1iQxByKjVQF5FDJ0PFL6" crossorigin="anonymous" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+3i5JkX5zVb8K5v6XW5t5p6RhoX8" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display:none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <header th:replace="fragments/header :: header"></header>

    <main class="container my-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Search Bar -->
        <div class="filter-bar">
            <input id="searchInput" type="text" placeholder="Search students..." />
        </div>

        <div id="emptyState" class="empty-state" style="display:none;">
            No students found.
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Roll</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Marks</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <tr th:each="student : ${students}">
                            <td th:text="${student.roll}"></td>
                            <td th:text="${student.name}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.marks}"></td>
                            <td>
                                <a class="btn btn-edit" th:href="@{'/students-view/edit/' + ${student.roll}}">Edit</a>
                                <a class="btn btn-delete" th:href="@{'/students-view/delete/' + ${student.roll}}" onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
