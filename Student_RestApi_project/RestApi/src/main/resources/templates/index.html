<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Student Dashboard</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.jpg}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1H9G1Q8K/6W2YdE2S8oFc5q1iQxByKjVQF5FDJ0PFL6" crossorigin="anonymous" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+3i5JkX5zVb8K5v6XW5t5p6RhoX8" crossorigin="anonymous"></script>
</head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <main class="container my-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Student Dashboard</h2>
            <a class="btn btn-primary" th:href="@{/students-view/add}">Add Student</a>
        </div>
        <div th:if="${students.empty}" class="empty-state">
            No students found.
        </div>
        <div th:unless="${students.empty}" class="card">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Roll</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Marks</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.roll}"></td>
                            <td th:text="${student.name}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.marks}"></td>
                            <td>
                                <a class="btn btn-warning btn-sm me-2" th:href="@{'/students-view/edit/' + ${student.roll}}">Edit</a>
                                <a class="btn btn-danger btn-sm" th:href="@{'/students-view/delete/' + ${student.roll}}" onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
